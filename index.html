<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn for Free — Curated Coding Resources</title>
<meta name="description" content="A curated list of free resources for learning programming, web development, DevOps, cloud and security.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>LEARN FOR FREE</h1>
    <p>A curated list of free places to learn programming, web development, DevOps, cloud and security. Each link goes to the resource's own site.</p>
  </header>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search topics… (e.g. Python, cloud)" aria-label="Search topics">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </div>

  <div class="count" id="count" aria-live="polite"></div>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty">No matches. Try another search or category.</p>

  <footer>Links last checked November 2026. All resources belong to their respective owners.</footer>
</div>

<script src="script.js"></script>
</body>
</html>
